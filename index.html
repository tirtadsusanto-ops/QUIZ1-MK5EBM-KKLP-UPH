<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis 1 MK 5 Kedokteran Berbasis Bukti pada KKLP</title>
<style>
:root{--navy:#1F3864;--navy2:#2E4A7D;--line:#C9D3E3;--bg:#F4F6FA;--card:#FFFFFF;--text:#1B2433;--muted:#5B6678;--ok:#1E7B4A;--warn:#9A5B00;--bad:#B3261E;--sel:#E6EDF8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center}
header.top img{width:40px;height:40px;border-radius:4px;background:#fff}
header.top .t1{font-weight:700;font-size:15px}
header.top .t2{font-size:13px;opacity:.9}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
h1{font-size:22px;margin:0 0 6px;color:var(--navy)}
h2{font-size:18px;margin:0 0 8px;color:var(--navy)}
.muted{color:var(--muted);font-size:14px}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:1px solid #9AA8BF;border-radius:8px}
input[type=text]:focus{outline:3px solid #9DB6E3;border-color:var(--navy2)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;font-size:15px}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--navy);padding:10px 16px;min-height:44px}
button.pri{background:var(--navy);color:#fff;font-weight:600}
button.sec{background:#fff;color:var(--navy)}
button.lnk{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px;min-height:0}
button:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--bad);font-size:14px;margin-top:6px;min-height:1px}
.box{border-left:4px solid var(--navy2);background:var(--sel);padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.box.warn{border-color:var(--warn);background:#FFF4E0}
.box.bad{border-color:var(--bad);background:#FDECEA}
ul.rules{margin:6px 0 0 18px;padding:0;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.bar .who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bar .sisa{display:flex;align-items:baseline;gap:6px}
.bar .timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:18px;color:var(--navy)}
.bar .timer.lo{color:var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.nav a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);text-decoration:none;font-weight:600;font-size:14px}
.nav a.part{border-color:var(--warn);background:#FFF4E0}
.nav a.full{border-color:var(--ok);background:#E5F4EC}
.stem{margin:6px 0 10px;white-space:pre-wrap}
.st{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid #E6EAF1}
.st .tx{min-width:0}
.st .tx b{color:var(--navy)}
.opts{display:flex;gap:6px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid #9AA8BF;border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer;user-select:none;background:#fff}
.opts input{width:18px;height:18px;margin:0}
.opts label.on{background:var(--navy);border-color:var(--navy);color:#fff}
.alert{position:sticky;top:60px;z-index:4}
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res th,table.res td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.res th{background:#E3E9F3}
table.res td.l{text-align:left}
.total{font-size:28px;font-weight:800;color:var(--navy);margin:8px 0}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 12px;font-size:15px}
.kv div:nth-child(odd){color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:520px;width:100%;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
footer{max-width:860px;margin:0 auto;padding:4px 16px 24px;text-align:right}
@media (max-width:560px){.st{grid-template-columns:1fr}.opts label{flex:1;justify-content:center}.kv{grid-template-columns:1fr}.kv div:nth-child(odd){margin-top:6px}main{padding:12px}}
@media print{.bar,.nav,button,footer{display:none!important}}
</style>
</head>
<body>
<header class="top"><img id="logo" alt="Logo UPH"><div><div class="t1">Universitas Pelita Harapan · Fakultas Kedokteran · Prodi Sp.KKLP</div><div class="t2" id="subjudul"></div></div></header>
<div id="app"><main><div class="card">Memuat aplikasi kuis…</div><noscript><div class="card">Aplikasi ini memerlukan JavaScript.</div></noscript></main></div>
<footer id="foot"></footer>
<script>
(function () {

  // ---------- penilaian ----------
  // jawaban: string 4n karakter 'B', 'S', atau '-' (kosong); kunci: string 4n karakter 'B'/'S'
  function nilai(jawaban, kunci) {
    var n = kunci.length / 4, skor = [], benar = [], tot = 0;
    for (var i = 0; i < n; i++) {
      var c = 0;
      for (var j = 0; j < 4; j++) if (jawaban.charAt(i * 4 + j) === kunci.charAt(i * 4 + j)) c++;

    }
    return { benar: benar, skor: skor, total: Math.round((tot / n) * 100) / 100 };
  }
  function angkaID(x) { var s = (Math.round(x * 100) / 100).toString(); return s.replace(".", ","); }

  // ---------- waktu WIB (UTC+7, tanpa bergantung zona waktu perangkat) ----------
  var HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  var BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function wib(ms) {
    var d = new Date(ms + 7 * 3600000);
    return HARI[d.getUTCDay()] + ", " + d.getUTCDate() + " " + BULAN[d.getUTCMonth()] + " " + d.getUTCFullYear() + " pukul " + p2(d.getUTCHours()) + "." + p2(d.getUTCMinutes()) + "." + p2(d.getUTCSeconds()) + " WIB";
  }
  function durasiTeks(det) { det = Math.max(0, Math.round(det)); return Math.floor(det / 60) + " menit " + (det % 60) + " detik"; }

  var URUT = ["v", "app", "kuis", "build", "nama", "npm", "jawaban", "skor", "total", "mulai", "selesai", "durasi_detik", "otomatis", "keluar_halaman", "jam_anomali", "mode", "percobaan_id", "reset"];

  // ---------- teks yang tampil pada PDF (dipakai juga oleh alat verifikasi) ----------
  function teksPDF(r, meta) {
    var jw = function (i) { var s = []; for (var j = 0; j < 4; j++) { var c = r.jawaban.charAt(i * 4 + j); s.push("abcd".charAt(j) + ": " + (c === "-" ? "kosong" : c)); } return s.join("   "); };

      judul: "HASIL " + meta.nama.toUpperCase(),
      sub: "MK 5 Kedokteran Berbasis Bukti pada KKLP | Semester Ganjil 2026/2027 | Sesi " + meta.sesi + ", " + meta.tanggal,

  var WIN = { 0x20ac: 128, 0x201a: 130, 0x192: 131, 0x201e: 132, 0x2026: 133, 0x2020: 134, 0x2021: 135, 0x2c6: 136, 0x2030: 137, 0x160: 138, 0x2039: 139, 0x152: 140, 0x17d: 142, 0x2018: 145, 0x2019: 146, 0x201c: 147, 0x201d: 148, 0x2022: 149, 0x2013: 150, 0x2014: 151, 0x2dc: 152, 0x2122: 153, 0x161: 154, 0x203a: 155, 0x153: 156, 0x17e: 158, 0x178: 159 };

  var ASCII = { "Œ": "OE", "œ": "oe", "Æ": "AE", "æ": "ae", "ß": "ss", "Ø": "O", "ø": "o", "Đ": "D", "đ": "d", "Ł": "L", "ł": "l", "ı": "i", "Þ": "Th", "þ": "th", "Ð": "D", "ð": "d", "Ħ": "H", "ħ": "h" };

  function lebar(s, W, size) { var b = keWin(s), w = 0; for (var i = 0; i < b.length; i++) w += W[b[i]]; return (w * size) / 1000; }
  function pecah(s, W, size, maks) {
    var kata = String(s).split(/\s+/), baris = [], cur = "";

      if (cur) baris.push(cur);
      while (lebar(k, W, size) > maks) { var n = k.length; while (n > 1 && lebar(k.slice(0, n), W, size) > maks) n--; baris.push(k.slice(0, n)); k = k.slice(n); }

  function strPDF(s) {

    for (var i = 0; i < b.length; i++) { var c = b[i]; if (c === 40 || c === 41 || c === 92) o += "\\" + String.fromCharCode(c); else if (c < 127) o += String.fromCharCode(c); else o += "\\" + ("00" + c.toString(8)).slice(-3); }
    return o + ")";
  }
  function f2(x) { return (Math.round(x * 100) / 100).toString(); }
  // buat PDF; kembalikan Uint8Array
  function buatPDF(r, meta, aset) {
